<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Agency quote calculator</title><style>body{background:#101521;color:#fff;font:16px system-ui}main{max-width:600px;margin:auto;padding:20px}label{display:block;margin:12px 0}input,button{display:block;width:100%;box-sizing:border-box;padding:12px;font:inherit;border-radius:8px}button{background:#e8c47c;margin-top:20px}pre{white-space:pre-wrap}</style><main><h1>Agency quote calculator</h1><p>Labor, software, subcontracting, overhead and contingency. Use one currency throughout. Estimates only; no live quotes or orders.</p><form id="calc"><label>Labor<input id="labor" type="number" min="0" max="1000000000" step="0.01" required value="0"></label><label>Software<input id="software" type="number" min="0" max="1000000000" step="0.01" required value="0"></label><label>Subcontracting<input id="subcontracting" type="number" min="0" max="1000000000" step="0.01" required value="0"></label><label>Overhead<input id="overhead" type="number" min="0" max="1000000000" step="0.01" required value="0"></label><label>Contingency<input id="contingency" type="number" min="0" max="1000000000" step="0.01" required value="0"></label><label>Price<input id="price" type="number" min="0" max="1000000000" step="0.01" required value="0"></label><button>Calculate</button></form><pre id="result" aria-live="polite"></pre></main><script src="calculator.js" defer></script></html>
